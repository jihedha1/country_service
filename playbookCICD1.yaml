---
- name: Build, Push Docker Image to Docker Hub, and Deploy to Kubernetes
  hosts: localhost
  connection: local

  vars:
    image_name: my-country-service
    image_tag: v1
    dockerfile_path: ./
    docker_registry_username: jihedhallem
    docker_registry_password: 53643810ji
    kubernetes_api_host: "https://kubernetes.docker.internal:6443"
    kubernetes_api_key: "{{ lookup('env', 'K8S_API_TOKEN' ) }}"

  tasks:
    - name: Log in to Docker Hub
      community.general.docker_login:
        username: "{{ docker_registry_username }}"
        password: "{{ docker_registry_password }}"
        reauthorize: yes

    - name: Build Docker image
      community.docker.docker_image: # Utiliser le nom complet de la collection est une bonne pratique
        build:
          path: "{{ dockerfile_path }}"
        name: "{{ docker_registry_username }}/{{ image_name }}:{{ image_tag }}"
        source: build
        state: present

    - name: Push the Docker image to Docker Hub
      community.docker.docker_image:
        name: "{{ docker_registry_username }}/{{ image_name }}:{{ image_tag }}"
        push: yes
        source: local

    - name: Apply Kubernetes Deployment
      kubernetes.core.k8s:
        state: present
        namespace: jenkins
        src: deployment.yaml
        validate_certs: no
        host: "{{ kubernetes_api_host }}"
        api_key: "{{ kubernetes_api_key }}"

    - name: Apply Kubernetes Service
      kubernetes.core.k8s:
        state: present
        namespace: jenkins
        src: service.yaml
        validate_certs: no
        host: "{{ kubernetes_api_host }}"
        api_key: "{{ kubernetes_api_key }}"
